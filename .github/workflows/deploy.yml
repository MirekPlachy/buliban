name: Nasazení na GitHub Pages

on:
  # Nasadit při každém pushi do hlavní větve
  push:
    branches: [main]
  # ...a taky ručně z karty Actions
  workflow_dispatch:

# Oprávnění potřebná pro publikaci na Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Souběžné nasazení nespouštět; rozdělaný běh nechat doběhnout
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Build
        run: npm run build

      - name: Nahrání artefaktu
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Nasazení
        id: deployment
        uses: actions/deploy-pages@v4
